<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A live virtual fitting room for independent Bangladesh fashion.">
<title>DЯAPE — Live Try-On</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="floor.css">
<link rel="stylesheet" href="gravity.css"><link rel="preload" href="assets/zero/camera.webp" as="image"><script type="module" src="gravity.js"></script><script type="module" src="navigation.js"></script><link rel="stylesheet" href="fitting.css"></head>
<body>
<header class="flat-header">
  <a class="flat-logo" href="./" aria-label="Drape home"><img src="assets/wordmark.png" alt="DЯAPE"></a>
  <nav aria-label="Main navigation">
    <button type="button" data-info="about">About</button>
    <button type="button" data-info="brands">For Brands</button>
    <button type="button" data-info="contact">Contact Us</button>
  </nav>
</header>
<main id="space" aria-label="Zero-gravity fashion collection"></main>
<p class="explore">✥ &nbsp; Drag to explore</p>
<aside id="detail" role="tooltip"><small>Demo collection ↗</small><strong></strong><span></span></aside>
<dialog id="info" aria-labelledby="info-title"><form method="dialog" class="info-close"><button>Close</button></form><div class="info-copy"></div></dialog><dialog id="fitting" aria-label="Virtual fitting room">
  <div class="camera-stage">
    <div class="camera-rear">
      <img class="hardware" src="assets/zero/camera-rear-frame.png" alt="">
      <div class="lcd">
        <div class="lcd-nav"><button data-action="close">← Back to the edit</button><button data-action="playback">Playback</button></div>
        <section class="preview" aria-label="Camera preview">
          <video autoplay muted playsinline hidden></video><img class="uploaded" alt="Uploaded preview" hidden>
          <span class="live-indicator">● LIVE TRY-ON PROTOTYPE</span>
          <div class="reticle" aria-hidden="true"></div>
          <div class="preview-tools">
            <button data-action="webcam">Enable camera</button><button data-action="switch" disabled>Switch camera</button>
            <button data-action="capture" disabled>Capture</button><button data-action="expand" aria-pressed="false">Expand</button>
            <label class="file-control">Upload<input type="file" accept="image/*"></label>
          </div>
        </section>
        <section class="wardrobe-panel" aria-label="Wardrobe">
          <div class="filter-bar"><select class="brands" aria-label="Filter by brand"></select><div class="filters" aria-label="Categories"></div></div>
          <div class="catalogue"></div>
          <p class="catalogue-note">Try On prototype</p>
          <div class="services">
            <button data-action="size">Find My Size<small>Discover your perfect fit</small></button>
            <button data-action="look">Complete the Look<small>Build your complete outfit</small></button>
          </div>
        </section>
        <section class="camera-panel" hidden aria-label="Camera tools"></section>
        <p class="room-status" role="status"></p>
      </div>
    </div>
  </div>
  <div class="shutter-flash" aria-hidden="true"></div>
</dialog>
</body></html>
