<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A live virtual fitting room for independent Bangladesh fashion.">
<title>DЯAPE — Live Try-On</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="floor.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="flat-header">
  <a class="flat-logo" href="./" aria-label="Drape home"><img src="assets/wordmark.png" alt="DЯAPE"></a>
  <nav aria-label="Main navigation">
    <button type="button" data-info="about">About</button>
    <button type="button" data-info="brands">For Brands</button>
    <button type="button" data-info="menu">Menu</button>
  </nav>
</header>
<main id="home" class="flat-home">
  <h1 class="visually-hidden">Drape virtual fitting room</h1>
  <div id="floor" class="floor" aria-label="Garments arranged on a concrete floor">
    <div class="floor-scene" id="floor-scene">
      <div id="floor-garments"></div>
      <button type="button" class="scene-camera" id="scene-camera" aria-label="Try on live">
        <span class="camera-cutout" aria-hidden="true"></span>
      </button>
      <button type="button" class="camera-caption" data-open>Try on live</button>
    </div>
  </div>
  <p class="drag-note" aria-hidden="true">☝︎ <span>Drag to explore</span></p>
  <aside class="hover-label" id="hover-label" hidden>
    <strong></strong><span></span><small></small>
  </aside>
</main>
<dialog class="flat-info" id="flat-info">
  <form method="dialog"><button class="outline">Close</button></form>
  <h2></h2><p></p><button class="pill primary" data-open>Try on live</button>
</dialog>
<section id="room" hidden aria-labelledby="room-heading">
  <div class="room-top"><button class="outline" id="back">Back to the edit</button><h1 id="room-heading" tabindex="-1">Fitting room</h1></div>
  <div class="room-grid">
    <div class="mirror-column">
      <div class="camera-back">
        <div class="camera-brand">DRAPE <span>LIVE VIEW</span></div>
        <div class="view">
          <video id="mirror" autoplay playsinline muted hidden></video>
          <div id="standby"><span class="focus-box"></span><p>Your mirror is ready</p><button class="pill primary" id="start">Enable camera</button></div>
          <span id="view-label" class="view-label" hidden></span>
        </div>
        <div class="camera-base"><span>DRAPE / LIVE FITTING</span><button class="outline" id="stop" hidden>Turn camera off</button></div>
      </div>
      <p id="status" role="status">Enable your camera when you’re ready. Live try-on sends your video to Decart.</p>
    </div>
    <aside class="wardrobe">
      <h2>Pick a piece.</h2>
      <div id="garments" class="garments" aria-label="Garments available for try-on" tabindex="0"></div>
      <label class="upload">Upload a garment<input type="file" id="upload" accept="image/jpeg,image/png,image/webp"></label>
      <p id="selection" aria-live="polite"></p>
      <div class="tools"><button class="outline" id="size">Find My Size</button><button class="outline" id="style">Complete the Look</button></div>
      <div id="tool-panel" hidden></div>
    </aside>
  </div>
</section>
<div id="flash" aria-hidden="true"></div>
</body>
</html>
